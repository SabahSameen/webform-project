<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wild Rescues – Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f7f7f7; }
    form { max-width: 520px; background: #fff; padding: 1.5rem; border-radius: 8px; }
    label { display:block; margin-top: .75rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: .5rem; margin-top: .25rem; border: 1px solid #ccc; border-radius: 4px; }
    fieldset { border:1px solid #ccc; padding:1rem; margin-top:1rem; }
    legend { font-weight: 700; }
    small { display:block; color:#555; font-size:.8rem; margin-top:.25rem; }
    button { margin-top:1rem; padding:.6rem 1rem; border:0; background:#2c7a7b; color:#fff; border-radius:4px; cursor:pointer; }
    button:hover { background:#256b6c; }
  </style>
</head>
<body>
  <h1>Contact Wild Rescues</h1>

  <form action="#" method="post" autocomplete="on">
    <fieldset>
      <legend>Your Details</legend>

      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" placeholder="First Last" required minlength="2" autocomplete="name">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">

      <label for="tel">Phone (US)</label>
      <input id="tel" name="tel" type="tel" placeholder="555-123-4567"
             pattern="\d{3}[- ]?\d{3}[- ]?\d{4}" aria-describedby="tel-help" autocomplete="tel">
      <small id="tel-help">Format: 555-123-4567</small>
    </fieldset>

    <fieldset>
      <legend>How Can We Help?</legend>

      <label for="topic">Topic</label>
      <select id="topic" name="topic" required>
        <option value="">-- Please choose --</option>
        <option>Animal Rescue</option>
        <option>Volunteer Information</option>
        <option>Donation Support</option>
        <option>General Question</option>
      </select>

      <p style="margin-top:.75rem;">Preferred Contact Method</p>
      <label><input type="radio" name="contact" value="email" required> Email</label>
      <label><input type="radio" name="contact" value="phone"> Phone</label>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" maxlength="500"
                placeholder="How can we help?" required></textarea>

      <label>
        <input type="checkbox" name="terms" required>
        I agree to the terms and understand this is a demo form.
      </label>
    </fieldset>

    <button type="submit">Send</button>
  </form>
</body>
</html>
